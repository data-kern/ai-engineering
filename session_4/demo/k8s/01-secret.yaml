# ─────────────────────────────────────────────────────────────────────────────
# 01-secret.yaml — Store the Groq API key securely.
#
# NEVER put API keys in the Dockerfile or bake them into the image.
# Kubernetes Secrets inject them at runtime as environment variables.
#
# HOW TO CREATE THIS SECRET:
#   kubectl create secret generic groq-secret \
#     --from-literal=GROQ_API_KEY=your_actual_key_here
#
# Then apply the rest:
#   kubectl apply -f k8s/02-deployment.yaml
#   kubectl apply -f k8s/03-service.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: groq-secret
type: Opaque
# stringData lets you write plain text — Kubernetes base64-encodes it for you.
# Replace the value below with your actual Groq API key.
stringData:
  GROQ_API_KEY: "your-groq-api-key-here"
