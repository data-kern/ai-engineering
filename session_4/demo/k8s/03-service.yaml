# ─────────────────────────────────────────────────────────────────────────────
# 03-service.yaml — Give the deployment a stable network address.
#
# Problem: Pod IP addresses change every time a pod restarts or is replaced.
#          Consumers can't rely on a moving target.
#
# Solution: A Kubernetes Service provides a STABLE IP (ClusterIP) and
#           port that never changes, regardless of pod restarts.
#           The Service routes traffic to whichever pods are healthy.
#
# NodePort: makes the service reachable from your laptop at localhost:30001.
#           (Port 30001 to avoid conflict with Session 3's port 30000.)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: rag-demo-service
spec:
  type: NodePort
  selector:
    app: rag-demo         # Routes traffic to all pods with this label

  ports:
    - port: 8000          # Internal cluster port
      targetPort: 8000    # Container port
      nodePort: 30001     # External port on your laptop (localhost:30001)
