# ==============================================================================
# EXERCISE 5: Protecting the Keys
#
# Docker is great, but you NEVER hardcode an API key in a Dockerfile.
# If you do, anyone with the image can steal your key.
# Instead, we will store the key in a Kubernetes Secret, and Kubernetes will
# inject it into our container safely at runtime as an environment variable.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  # TODO 1: Give your secret a name so the Deployment can find it later.
  # -> e.g., name: riverbank-secrets
  
type: Opaque
stringData:
  # TODO 2: Add your actual Groq API key here.
  # Why stringData instead of data? Because stringData lets us type plain text,
  # and Kubernetes will automatically Base64 encode it for us so it's safely stored.
  # -> GROQ_API_KEY: "gsk_your_real_key_here"
  
