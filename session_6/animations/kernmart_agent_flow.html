<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How One Request Flows</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0F172A; --muted: #475569; --bg: #EEF2F7; --card: #FFFFFF; --line: #D5DCE6; --blue: #2563EB; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; padding: 10px 16px 12px; gap: 8px; overflow: hidden; }

  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 20px; }
  h1 { font-family: 'Outfit', sans-serif; font-size: 1.35rem; letter-spacing: .2px; white-space: nowrap; }
  h1 span { color: var(--blue); }
  h1 small { font: 600 .7rem 'Inter', sans-serif; letter-spacing: 1.4px; color: #64748B; margin-left: 10px; text-transform: uppercase; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 600; padding: 2px 9px 2px 6px; border-radius: 99px; border: 1.8px solid; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .c-model { background: #EDE9FE; border-color: #7C3AED; color: #4C1D95; } .c-model i { background: #7C3AED; }
  .c-code  { background: #DBEAFE; border-color: #2563EB; color: #1E3A8A; } .c-code i  { background: #2563EB; }
  .c-guard { background: #FEE2E2; border-color: #DC2626; color: #991B1B; } .c-guard i { background: #DC2626; }
  .c-human { background: #FEF3C7; border-color: #D97706; color: #92400E; } .c-human i { background: #D97706; }
  .c-data  { background: #D1FAE5; border-color: #059669; color: #065F46; } .c-data i  { background: #059669; }
  .c-dec   { background: #F1F5F9; border-color: #334155; color: #0F172A; } .c-dec i   { background: #334155; border-radius: 2px; transform: rotate(45deg) scale(.85); }
  .note { color: var(--muted); font-size: .74rem; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; }
  .group { display: flex; align-items: center; gap: 6px; }
  .group .lbl { font-size: .72rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #64748B; margin-right: 2px; }
  button { font: 600 .84rem 'Inter', sans-serif; padding: 6px 13px; border-radius: 8px; border: 2px solid var(--blue); background: #fff; color: #1E3A8A; cursor: pointer; }
  button.primary { background: var(--blue); color: #fff; min-width: 96px; }
  button.seg { border-color: #94A3B8; color: #334155; }
  button.seg.on { background: #E0E7FF; border-color: #4F46E5; color: #312E81; }
  button:hover:not(:disabled) { filter: brightness(.96); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 3px solid #FACC15; outline-offset: 2px; }
  #pos { font-size: .78rem; color: var(--muted); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }

  .card { flex: 1; min-height: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(15,23,42,.06); }
  svg { display: block; width: 100%; height: 100%; }

  svg text { font-family: 'Inter', system-ui, sans-serif; }
  .lane  { font-size: 17px; font-weight: 700; letter-spacing: 1.2px; }
  .lanesub { font-size: 13px; fill: #475569; }
  .bt  { font-size: 15.5px; font-weight: 700; }
  .bs  { font-size: 12.5px; fill: #1F2937; }
  .num { font-size: 13px; font-weight: 700; fill: #fff; }
  .tag { font-size: 12px; font-weight: 600; fill: #475569; }
  .dt  { font-size: 13.5px; font-weight: 700; }
  .ds  { font-size: 11.5px; fill: #334155; font-weight: 600; }
  .loopt { font-size: 15px; font-weight: 700; letter-spacing: 1.6px; fill: #4338CA; }
  .loops { font-size: 13px; fill: #4F46E5; }
  .lb  { font-size: 13px; font-weight: 600; fill: #334155; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .lbh { fill: #92400E; } .lbl { fill: #4338CA; } .lbd { fill: #047857; } .lbs { fill: #B91C1C; } .lbs2 { fill: #B91C1C; font-weight: 500; font-size: 12px; }

  .ar { fill: none; stroke-width: 2.8; stroke-linejoin: round; }
  .ar.main  { stroke: #334155; }
  .ar.human { stroke: #D97706; }
  .ar.loop  { stroke: #6366F1; stroke-dasharray: 9 6; }
  .ar.stop  { stroke: #DC2626; }
  .ar.data  { stroke: #059669; stroke-width: 2.4; stroke-dasharray: 3 5; stroke-linecap: round; }

  /* lap tracker */
  .chip rect { fill: #EEF2FF; stroke: #6366F1; stroke-width: 1.8; }
  .ct { font-size: 12.5px; font-weight: 700; letter-spacing: 1px; fill: #3730A3; }
  .cs { font-size: 12px; fill: #1E1B4B; }
  g.chip { transition: opacity .4s ease, filter .4s ease; }
  g.chip.pending { opacity: .3; }
  g.chip.active { filter: drop-shadow(0 0 6px rgba(99,102,241,.8)); }
  g.chip.active rect { fill: #E0E7FF; stroke: #4338CA; stroke-width: 3; }
  g.chip.stopc rect { fill: #FEE2E2; stroke: #DC2626; }
  g.chip.stopc .ct, g.chip.stopc .cs { fill: #7F1D1D; }

  /* play-through states */
  .el { transition: opacity .45s ease, filter .45s ease; }
  .el.dim { opacity: .11; }
  .el.hot { filter: drop-shadow(0 0 7px rgba(250,204,21,.95)); }
  .el.hotred { filter: drop-shadow(0 0 8px rgba(220,38,38,.9)); }
  @media (prefers-reduced-motion: reduce) { .el, g.chip { transition: none; } }
</style>
</head>

<header>
  <h1>KernMart Support Agent · <span>how one request flows</span><small>DataKern · AI Engineering</small></h1>
  <div class="legend">

    <span class="chip c-code"><i></i>Code</span>
    <span class="chip c-guard"><i></i>Safety check</span>

    <span class="chip c-dec"><i></i>Decision</span>
    <span class="note">numbers = order of steps · “script 04” = demo script that adds the box</span>
  </div>
</header>

<div class="bar">
  <div class="group">
    <span class="lbl">Scenario</span>
    <button class="seg on" id="sc-normal">Refund, then answer</button>

  </div>
  <div class="group">
    <button id="prev">◀ Previous</button>
    <button class="primary" id="play">▶ Play</button>
    <button id="next">Next ▶</button>
    <span id="pos">full view</span>
    <button id="all">Show all</button>
  </div>
</div>

</g><circle id="packet" r="8" cx="-20" cy="-20" fill="#FACC15" stroke="#92400E" stroke-width="2.5" opacity="0"/></svg>
</div>

<script>
  const svg = document.getElementById('flow');
  const $ = id => document.getElementById(id);
  const packet = $('packet');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ALL = [...svg.querySelectorAll('.el')];
  const byId = Object.fromEntries(ALL.filter(e => e.id).map(e => [e.id, e]));
  const labels = ALL.filter(e => e.tagName === 'text' && !e.id);       // arrow captions, lit with their neighbours
  const CHIPS = [0, 1, 2, 3].map(k => ({ g: $('chip' + k), t: $('chip' + k + 't'), a: $('chip' + k + 'a'), b: $('chip' + k + 'b') }));

  /* ---------- scenarios: frames light elements cumulatively; `hot` glows now; `pk` = arrows the dot travels ---------- */
  const PRE = [
    { add: ['b1'] },
    { add: ['a1', 'b2'], pk: ['a1'] },
    { add: ['a2', 'b3'], pk: ['a2'] },
    { add: ['a3', 'b4', 'm1', 'd1'], pk: ['a3'] },
  ];
  const lapThink = (n, steps) => ({ add: ['a4', 'b5', 'a5', 'dec'], hot: ['b5', 'dec'], pk: n === 1 ? ['a4', 'a5'] : ['a_ok', 'a5'], lap: n, lim: steps });
  const lapCheck = { add: ['a_yes', 'b7'], hot: ['dec', 'b7'], pk: ['a_yes'] };
  const lapRun   = { add: ['a_low', 'b9', 'k1', 'd3', 'r1', 'd4'], hot: ['b9', 'd3'], pk: ['a_low'] };
  const lapLimit = (n) => ({ add: ['a_lim', 'lim', 'a_ok'], hot: ['lim'], pk: ['a_lim'], lap: n, lim: n, limhot: true });

  const NORMAL = {
    chips: [['LAP 1', 'asks get_order', 'result comes back'], ['LAP 2', 'asks eligibility', 'result: eligible'],
            ['LAP 3', 'asks issue_refund', 'human approves'], ['LAP 4', 'no tool needed', 'writes the answer']],
    frames: [...PRE,
      lapThink(1, 1), lapCheck, lapRun, lapLimit(1),
      lapThink(2, 2), lapCheck, lapRun, lapLimit(2),
      lapThink(3, 3), lapCheck,
      { add: ['a_risk', 'b8', 'p1', 'd2'], hot: ['b8', 'd2'], pk: ['a_risk'], lap: 3 },
      { add: ['a_hum', 'b9', 'k1', 'd3'], hot: ['b9', 'd3'], pk: ['a_hum'], lap: 3 },
      lapLimit(3),
      { add: ['a5', 'dec'], hot: ['b5', 'dec'], pk: ['a_ok', 'a5'], lap: 4, lim: 4 },
      { add: ['a_no', 'b11'], hot: ['dec', 'b11'], pk: ['a_no'], lap: 4, done: true },
      { add: ['a_end', 'b12'], hot: ['b12'], pk: ['a_end'], lap: 4, done: true },
      { add: ['obs'], hot: ['obs'], lap: 4, done: true },
    ],
  };
  const STOP = {
    chips: [['LAP 1', 'asks a tool', 'result comes back'], ['LAP 2', 'asks a tool', 'result comes back'],
            ['LAP 3 – 7', 'still asking…', 'no answer, ever'], ['LAP 8', 'LIMIT REACHED', 'loop is cut off']],
    stopChip: 3,
    frames: [...PRE,
      lapThink(1, 1), lapCheck, lapRun, lapLimit(1),
      lapThink(2, 2), lapCheck, lapRun, lapLimit(2),
      { add: ['a5', 'dec'], hot: ['b5', 'dec', 'lim'], pk: ['a_ok', 'a5'], lap: 3, lim: 3 },
      { add: ['a_yes', 'b7', 'a_low', 'b9'], hot: ['b7', 'b9'], pk: ['a_yes', 'a_low'], lap: 3, lim: 7 },
      { add: ['a5', 'dec'], hot: ['b5', 'dec'], pk: ['a_lim', 'a_ok', 'a5'], lap: 4, lim: 8 },
      { add: ['a_yes', 'b7', 'a_low', 'b9'], hot: ['b7', 'b9'], pk: ['a_yes', 'a_low'], lap: 4, lim: 8 },
      { add: ['a_lim', 'lim'], hot: ['lim'], pk: ['a_lim'], lap: 4, lim: 8, limhot: true, limbad: true },
      { add: ['a_stop', 'bstop'], hot: ['bstop'], pk: ['a_stop'], lap: 4, lim: 8, limbad: true },
      { add: ['a_sr', 'b12'], hot: ['b12'], pk: ['a_sr'], lap: 4, lim: 8, limbad: true },
      { add: ['obs'], hot: ['obs'], lap: 4, lim: 8, limbad: true },
    ],
  };

  let scenario = NORMAL, cur = -1, timer = null, raf = null;       // cur = -1 → full view

  function setChips(sc, upTo, done) {
    sc.chips.forEach((c, k) => {
      const ch = CHIPS[k];
      ch.t.textContent = c[0]; ch.a.textContent = c[1]; ch.b.textContent = c[2];
      const isStop = sc.stopChip === k;
      ch.g.classList.toggle('stopc', isStop);
      let state = 'pending';
      if (upTo < 0) state = 'done';                                  // full view: everything filled in
      else if (k + 1 < upTo) state = 'done';
      else if (k + 1 === upTo) state = done && !isStop ? 'done' : 'active';
      ch.g.classList.toggle('pending', state === 'pending');
      ch.g.classList.toggle('active', state === 'active');
    });
  }

  function render(i, animate) {
    cur = i;
    const sc = scenario;
    $('limtxt').textContent = 'max 8 steps';
    labels.forEach(l => l.classList.remove('dim'));
    if (i < 0) {                                                     // full view
      ALL.forEach(e => e.classList.remove('dim', 'hot', 'hotred'));
      setChips(sc, -1, true);
      $('pos').textContent = 'full view';
    } else {
      const lit = new Set(), hot = new Set();
      let lap = 0, lim = 0, limhot = false, limbad = false, done = false;
      sc.frames.slice(0, i + 1).forEach((f, k) => {
        f.add.forEach(id => lit.add(id));
        if (f.lap) lap = f.lap;
        if (f.lim) lim = f.lim;
        done = !!f.done;
        if (k === i) { (f.hot || f.add).forEach(id => hot.add(id)); limhot = !!f.limhot; limbad = !!f.limbad; }
      });
      ALL.forEach(e => {
        const on = !e.id ? true : lit.has(e.id);
        e.classList.toggle('dim', e.id ? !on : false);
        e.classList.toggle('hot', !!e.id && hot.has(e.id) && !(e.id === 'lim' && limbad) && e.id !== 'bstop');
        e.classList.toggle('hotred', !!e.id && ((e.id === 'lim' && limbad && limhot) || (e.id === 'bstop' && hot.has('bstop'))));
      });
      // arrow captions follow the arrows they annotate
      const cap = [['yes', 'a_yes'], ['no → final answer', 'a_no'], ['low risk → run', 'a_low'], ['risky → human', 'a_risk'],
                   ['↺ ok → next lap, back to the model', 'a_ok'], ['limit hit → stop', 'a_stop'], ['8 steps · 40k tokens · 120 s', 'a_stop'], ['recall', 'm1']];
      labels.forEach(l => { const m = cap.find(c => c[0] === l.textContent); l.classList.toggle('dim', m ? !lit.has(m[1]) : false); });
      if (lim) $('limtxt').textContent = `step ${lim} / 8`;
      setChips(sc, lap, done);
      $('pos').textContent = `${i + 1} / ${sc.frames.length}`;
      if (animate && !reduce) movePacket(sc.frames[i].pk || []);
    }
    $('prev').disabled = i < 0;
    $('next').disabled = i >= sc.frames.length - 1;
  }

  function movePacket(ids) {
    cancelAnimationFrame(raf);
    const paths = ids.map(id => byId[id]).filter(Boolean);
    if (!paths.length) { packet.setAttribute('opacity', 0); return; }
    const lens = paths.map(p => p.getTotalLength()), total = lens.reduce((a, b) => a + b, 0);
    const dur = Math.min(1100, 350 + total * 1.1), t0 = performance.now();
    packet.setAttribute('opacity', 1);
    (function tick(t) {
      let d = Math.min(1, (t - t0) / dur) * total, k = 0;
      while (k < paths.length - 1 && d > lens[k]) { d -= lens[k]; k++; }
      const p = paths[k].getPointAtLength(Math.min(d, lens[k]));
      packet.setAttribute('cx', p.x); packet.setAttribute('cy', p.y);
      if (t - t0 < dur) raf = requestAnimationFrame(tick); else setTimeout(() => packet.setAttribute('opacity', 0), 200);
    })(t0);
  }

  const last = () => scenario.frames.length - 1;
  function stop() { clearInterval(timer); timer = null; $('play').textContent = '▶ Play'; }
  function go(i) { render(Math.max(-1, Math.min(last(), i)), true); }
  function showAll() { stop(); cancelAnimationFrame(raf); packet.setAttribute('opacity', 0); render(-1, false); }
  function next() { stop(); if (cur < last()) go(cur + 1); }
  function prev() { stop(); if (cur > 0) go(cur - 1); else if (cur === 0) showAll(); }

  $('play').onclick = () => {
    if (timer) { stop(); return; }
    if (cur < 0 || cur >= last()) cur = -1;
    $('play').textContent = '❚❚ Pause';
    go(cur + 1);
    timer = setInterval(() => { if (cur >= last()) { stop(); return; } go(cur + 1); }, 1500);
  };
  $('next').onclick = next; $('prev').onclick = prev; $('all').onclick = showAll;

  function pick(sc, btn) { stop(); scenario = sc; $('sc-normal').classList.toggle('on', btn === 'sc-normal'); $('sc-stop').classList.toggle('on', btn === 'sc-stop'); cancelAnimationFrame(raf); packet.setAttribute('opacity', 0); render(-1, false); }
  $('sc-normal').onclick = () => pick(NORMAL, 'sc-normal');
  $('sc-stop').onclick = () => pick(STOP, 'sc-stop');

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { prev(); }
    else if (e.key === 'Escape' || e.key.toLowerCase() === 'r') showAll();
  });

  // #3 opens at frame 3; #stop-5 opens the limit scenario at frame 5 (handy for checking a frame without clicking)
  const m = location.hash.match(/^#(stop-)?(\d+)$/);
  if (m) { if (m[1]) pick(STOP, 'sc-stop'); render(+m[2], false); } else render(-1, false);
</script>
